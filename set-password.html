<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--dark:#0B0B0B;--cream:#F1F0EC;--gold:#C6A13A;--body:#4A4A4A;--muted:#8A8580;--line:#E0DCD3;--red:#c0392b;--green:#27ae60;}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{width:100%;max-width:420px;}
.logo-wrap{text-align:center;margin-bottom:32px;}
.logo-wrap span{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dark);}
.logo-wrap span em{color:var(--gold);font-style:normal;}
h1{font-family:'Spectral',Georgia,serif;font-weight:400;font-size:1.7rem;color:var(--dark);margin-bottom:6px;}
.subtitle{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:28px;}
.form-group{margin-bottom:18px;}
.form-label{display:block;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--dark);margin-bottom:7px;}
.form-input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:2px;font-size:14.5px;font-family:inherit;color:var(--dark);background:#fff;outline:none;transition:border-color .15s;}
.form-input:focus{border-color:var(--gold);}
.strength-bar{height:3px;border-radius:2px;margin-top:6px;background:var(--line);overflow:hidden;}
.strength-fill{height:100%;width:0;transition:width .3s,background .3s;border-radius:2px;}
.strength-label{font-size:11px;color:var(--muted);margin-top:4px;}
.btn{width:100%;background:var(--dark);color:var(--cream);border:none;padding:13px;font-family:inherit;font-size:14.5px;font-weight:600;border-radius:2px;cursor:pointer;transition:background .15s;}
.btn:hover{background:#222;}
.btn:disabled{background:#aaa;cursor:not-allowed;}
.error-msg{display:none;color:var(--red);font-size:13px;margin-bottom:14px;padding:10px 14px;background:rgba(192,57,43,.08);border-radius:2px;border-left:3px solid var(--red);}
.success-state{display:none;text-align:center;padding:12px 0;}
.success-icon{width:56px;height:56px;background:rgba(39,174,96,.1);border:1px solid rgba(39,174,96,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
.invalid-state{display:none;text-align:center;padding:12px 0;}
</style>
</head>
<body>
<div class="card">

  <div class="logo-wrap">
    <span>REVERENTIAL <em>CARE PORTAL</em></span>
  </div>

  <!-- Invalid / expired token -->
  <div class="invalid-state" id="invalid-state">
    <h1 style="margin-bottom:10px;">Link expired</h1>
    <p class="subtitle">This link has already been used or has expired.<br>
    Request a new one from the login page.</p>
    <a href="/login.html" style="display:inline-block;background:var(--dark);color:var(--cream);padding:12px 28px;border-radius:2px;font-size:14px;font-weight:600;text-decoration:none;">Go to login</a>
  </div>

  <!-- Set password form -->
  <div id="set-form">
    <h1 id="form-title">Set your password</h1>
    <p class="subtitle" id="form-subtitle">Choose a password for your Care Portal. At least 8 characters.</p>
    <div id="set-error" class="error-msg"></div>
    <form onsubmit="handleSetPassword(event)">
      <div class="form-group">
        <label class="form-label" for="new-password">New password</label>
        <input class="form-input" type="password" id="new-password" required
               placeholder="At least 8 characters" autocomplete="new-password"
               oninput="checkStrength(this.value)">
        <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
        <div class="strength-label" id="strength-label"></div>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm-password">Confirm password</label>
        <input class="form-input" type="password" id="confirm-password" required
               placeholder="Type it again" autocomplete="new-password">
      </div>
      <button type="submit" id="set-btn" class="btn" style="margin-top:6px;">Set password and sign in</button>
    </form>
  </div>

  <!-- Success -->
  <div class="success-state" id="success-state">
    <div class="success-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#27ae60" stroke-width="2.5">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1 style="margin-bottom:8px;">Password set.</h1>
    <p class="subtitle">Taking you to your portal…</p>
  </div>

</div>

<script>
  const params = new URLSearchParams(location.search);
  const token  = params.get('token');
  const mode   = params.get('mode'); // 'invite' or 'reset'

  if (!token) {
    document.getElementById('set-form').style.display    = 'none';
    document.getElementById('invalid-state').style.display = 'block';
  } else if (mode === 'reset') {
    document.getElementById('form-title').textContent    = 'Choose a new password';
    document.getElementById('form-subtitle').textContent = 'This link expires in 15 minutes and works once only.';
  }

  function checkStrength(val) {
    const fill  = document.getElementById('strength-fill');
    const label = document.getElementById('strength-label');
    if (!val) { fill.style.width='0'; label.textContent=''; return; }
    let score = 0;
    if (val.length >= 8)  score++;
    if (val.length >= 12) score++;
    if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const levels = [
      {w:'20%', bg:'#c0392b', t:'Too short'},
      {w:'40%', bg:'#e67e22', t:'Weak'},
      {w:'60%', bg:'#f1c40f', t:'Fair'},
      {w:'80%', bg:'#2ecc71', t:'Good'},
      {w:'100%', bg:'#27ae60', t:'Strong'},
    ];
    const l = levels[Math.min(score, 4)];
    fill.style.width      = l.w;
    fill.style.background = l.bg;
    label.textContent     = l.t;
    label.style.color     = l.bg;
  }

  async function handleSetPassword(e) {
    e.preventDefault();
    const errEl    = document.getElementById('set-error');
    const btn      = document.getElementById('set-btn');
    const password = document.getElementById('new-password').value;
    const confirm  = document.getElementById('confirm-password').value;
    errEl.style.display = 'none';

    if (password.length < 8) {
      errEl.textContent = 'Password must be at least 8 characters.';
      errEl.style.display = 'block'; return;
    }
    if (password !== confirm) {
      errEl.textContent = 'Passwords do not match.';
      errEl.style.display = 'block'; return;
    }

    btn.disabled = true; btn.textContent = 'Setting password…';

    try {
      const res = await fetch('/api/auth/set-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('set-form').style.display      = 'none';
        document.getElementById('success-state').style.display = 'block';
        setTimeout(() => { window.location.href = '/portal.html'; }, 1500);
      } else {
        errEl.textContent   = data.error || 'Something went wrong.';
        errEl.style.display = 'block';
        if (res.status === 401) {
          document.getElementById('set-form').style.display    = 'none';
          document.getElementById('invalid-state').style.display = 'block';
        }
        btn.disabled = false; btn.textContent = 'Set password and sign in';
      }
    } catch {
      errEl.textContent   = 'Connection error. Please try again.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Set password and sign in';
    }
  }
</script>
</body>
</html>
