jection, IMAG"],["Lighting","Front wash, follow spots, overhead grid, DMX programming, theatrical/concert lighting, house/emergency integration"],["Acoustics","Acoustic simulation against seating plan, RT60 targeting, panel/diffuser specification, background noise measurement"],["Control","Show control/cue systems, centralised AV control, remote management"]]},{id:"education",label:"Education",Icon:Ku,img:"photos/education-lecture-hall.webp",imgAlt:"A tiered lecture hall with projection screen and teaching desk",line:"If the back row cannot follow the lecture, the room is the problem.",pains:["Ceiling fans and split ACs sitting a few decibels below the teacher's voice","Teachers pushing their voice all week and losing it by Wednesday","A single front loudspeaker adding volume without adding clarity","Recorded and hybrid lectures that sound like a tunnel"],avl:[["Audio","Lecture hall PA, ceiling speaker distribution, wireless mics for lecturers, conference/seminar audio, feedback elimination"],["Video","Laser projectors, interactive flat panels, lecture capture/recording, video conferencing, digital signage"],["Lighting","Energy-efficient LED, auditorium/multipurpose lighting, zoned control"],["Acoustics","Background noise assessment, speech clarity for learning, noise reduction between spaces"],["Control","One-touch interfaces for non-technical staff, scheduled automation"]]},{id:"corporate",label:"Corporate",Icon:Hl,img:"photos/corporate-boardroom.webp",imgAlt:"A fully equipped corporate boardroom with conference microphones and display system",line:"Video calls where the far end hears every word the first time.",pains:["Glass-walled rooms with nothing in them to absorb a voice",'"Camera problems" and "network problems" that are room problems',"Town halls held in atriums and cafeterias never designed for speech","Rooms certified on paper but never verified in practice"],avl:[["Audio","Boardroom/conference audio, ceiling/surface speakers, beamforming/boundary mics, ot translate to a car, headphones or the auditorium","Production rooms assembled piece by piece, then failing mid service","Audio, video and control traffic all fighting over one unmanaged switch"],avl:[["Audio","Studio monitor placement/calibration, recording chain design, talkback/headphone distribution, acoustic isolation, Dante-networked recording"],["Video","Multi-camera rigs, green screen/virtual production, streaming/broadcast output, video switching/recording"],["Lighting","Studio lighting for video, colour-accurate LED panels, DMX-controlled broadcast setups"],["Acoustics","Full acoustic design: absorption, diffusion, bass trapping, flutter echo elimination, RT60 targeting for recording vs podcast vs broadcast"],["Control","DAW integration, hardware/software routing, remote recording over network"]]},{id:"residential",label:"Residential",Icon:Qu,img:"photos/residential-home-theatre.webp",imgAlt:"A professionally designed home theatre with acoustic panels and tiered seating",line:"The performance you already paid for, out of the room you have.",pains:["Bass overwhelming in one seat and absent in the next","Dialogue you keep rewinding, because of reflections you cannot hear as reflections","Seating placed for the furniture, not for the sound","Cinema levels travelling through the rest of the house after nine at night"],avl:[["Audio","Home theatre surround, whole-home multi-room audio, outdoor/poolside speakers, high-fidelity listening rooms"],["Video","Home theatre projection/screens, 4K display, media server/streaming integration"],["Lighting","Smart lighting control, home theatre scene lighting, landscape/architectural, home automation integration"],["Acoustics","Home theatre acoustic treatment, dedicated listening room design, soundproofing between spaces"],["Control","Single-app smart home (Control4/Savant/KNX compatible), voice control, scheduled scenes"]]}],sx=[{n:"01",title:"Measured assessment",Icon:_u,img:"photos/method-phase1-assessment.webp",imgAlt:"Engineer reviewing measurement software on a laptop beside a mixing console",body:"We visit the space in use and again when it is empty, and listen from where your audience actually sits. Reverberation, speech clarity, background noise and the existing system's response are measured with calibrated equipment, so the cause is identified rather than guessed at.",deliverable:"A written site survey report with annotated measurement graphs, prioritised recommendations and indicative budget ranges, yours to keep whether or not you continue."},{n:"02",title:"Acoustic simulation",Icon:El,img:"photos/method-phase2-simulation.webp",imgAlt:"EASE Focus 3 acoustic coverage prediction showing SPL heatmap across seating plan",body:"Treatment and loudspeaker layout are modelled in EASE Focus 3 against your actual seating plan. We know what every seat will receive before a single box is ordered.",deliverable:"Coverage prediction across the seating plan, targeting a 3 dB spread from the front row to the back, with the acoustic treatment schedule that makes it achievable."},{n:"03",title:"System design",Icon:Fl,img:"photos/method-phase3-design.webp",imgAlt:"Yamaha DSR115 speaker system design showing placement layout and frequency response analysis",body:"The design is written down: loudspeaker selection and positions, signal chain, network topology, control layout, and the predicted performance figures we intend to hit.",deliverable:"A full system design, itemised budget, signal flow drawing and a scope of work with predicted performance written into it."},{n:"04",title:"Physical integration",Icon:Hl,body:"Rigging, cabling, networking and installation, scheduled around your calendar. All overhead rigging is installed to load-rated standards with written load calculations. Existing equipment is reused wherever it is genuinely fit for purpose.",deliverable:"As-built cable schedule, rack elevations, rigging documentation and signal flow drawing matching what is actually in the building."},{n:"05",title:"Tuning and verification",Icon:El,img:"photos/method-phase5-smaart.webp",imgAlt:"Smaart v9 transfer function measurement showing magnitude and phase response",body:"Time alignment, equalisation and gain structure set by measurement in Smaart v9, then verified at the seats. The room is measured again and compared against the prediction from stage two.",deliverable:"A commissioning report with before and after transfer functions and intelligibility figures. If the result falls short of the prediction and the cause is within our scope, correcting it is on us."},{n:"06",title:"Documentation and training",Icon:Fl,body:"Your own staff or volunteers are trained on the system as installed, not on a generic manual. Procedures are written for the people who will actually operate it.",deliverable:"Operating manual, scene list, written procedures and a training session, so the system keeps working when the team changes."}],nx=[["Smaart v9 \u2014 System Alignment and Tuning","Rational Acoustics \xB7 certified","Verified before-and-after transfer functions on every project. The credential that turns opinion into evidence."],["Diploma in Audio Engineering and Music Production","AAT College, Chennai (formerly SAE)","Formal grounding in signal flow, acoustics and production: the foundation the rest is built on."],["Architectural Acoustics","SWAYAM / NPTEL \xB7 in progress, 2026","The absorption, geometry and reverberation recommendations behind every survey report."],["Certified Technology Specialist (CTS)","AVIXA \xB7 in progress, November 2026","The international benchmark credential for audiovisual systems integration."],["Networking and control platforms","Dante Level 2 (Audinate) \xB7 NETGEAR AV \xB7 Q-SYS Architect","Audio-over-IP across multiple switches, network configuration that keeps audio and video stable on one building network, and the control platform your staff will actually operate."]],rx=[["How do we start, and what does it cost?","Start with a free twenty minute call. We will work out whether the problem is the space, the system design, the installation or the way it is being operated, and tell you honestly if you do not need us. If you want to go deeper, a one hour discovery call is \u20B92,000 plus GST. A full site survey, on site with measurement equipment and followed by a written report, is normally \u20B98,000 plus GST, currently \u20B96,000 for the first ten clients. Travel and stay are extra where applicable, and the survey fee is adjusted in full against any project that follows."],["What will a full project cost?","It depends almost entirely on the space, which is why we measure and design before quoting. The survey report gives you a priority order, so you can spread the work across budget years instead of committing to all of it at once. We will give you honest budget ranges on the first call, before you have spent anything with us."],["We have a full band. Do you understand contemporary worship?","Yes. The founder has spent a decade mixing live bands, so the specific problems are familiar rather than theoretical. Low end from kick and bass covering the vocal, stage volume fighting the room, in-ear monitoring, tracks and click, and a livestream feed that has to work at the same time as the room."],["Do you handle video and lighting as well as sound?","Yes. Video and lighting are delivered with production partners we have worked alongside for years, specified and project managed to the same standard as the audio. You deal with one team and one scope of work."],["We already have a tech team. Are you replacing them?","No. Your team knows your services, your musicians and your building, and none of that transfers. Our job is to give them a system that behaves the same way every week and documentation that survives a handover, then train them on it."],["Where do you work?","Based in Chennai and Bengaluru, we work across Tamil Nadu, Kerala and Karnataka, from the capital cities down through Coimbatore, Trichy, Madurai and the Nagercoil and Kanniyakumari belt, and across Kochi, Thiruvananthapuram and the wider Kerala coast. Andhra Pradesh, Telangana and Hyderabad are covered from Bengaluru. Projects elsewhere in India are taken on merit, as are Gulf projects. Travel and stay are quoted separately and openly."],["What if something fails before a service or event?","Call or WhatsApp +91 99622 32223 directly. We will diagnose the fault on the call and tell you within minutes whether it is fixable remotely. If we need to be on site, we will tell you honestly how fast we can get there. Audio failures before a Sunday service, a conference or a feast day are exactly what this number is for."]];function Ms(){let[e,a]=(0,xe.useState)("churches"),[t,l]=(0,xe.useState)(0),[u,o]=(0,xe.useState)(0),[d,f]=(0,xe.useState)(()=>{try{return localStorage.getItem("rv_cookie_consent")==="yes"}catch(v){return!1}}),s=()=>{try{localStorage.setItem("rv_cookie_consent","yes")}catch(v){}f(!0)},[r,x]=(0,xe.useState)({name:"",org:"",space:"Church or house of worship",phone:"",email:"",message:""}),[L,g]=(0,xe.useState)("+91"),[h,C]=(0,xe.useState)(!1),[A,H]=(0,xe.useState)(!1),[m,n]=(0,xe.useState)(!1),[p,S]=(0,xe.useState)(!1),[b,R]=(0,xe.useState)(!1),[I,D]=(0,xe.useState)(""),[M,z]=(0,xe.useState)(!1),Y=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()),J={name:r.name.trim()?"":"Please tell us your name.",phone:r.phone.trim()?/^[0-9][0-9\s-]{5,14}$/.test(r.phone.trim())?"":"Enter the number without the country code.":"We need a number to reach you on.",email:r.email.trim()?Y(r.email)?"":"That email address does not look right.":"Please add an email address."},Fa=!!(J.name||J.phone||J.email),Na=I.trim()?Y(I)?"":"That email address does not look right.":"Please add an email address.",Pl=async v=>{let pe=await(await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({access_key:ux,...v})})).json();
