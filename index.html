ng ring for seconds, which suits the organ and defeats the sermon","The worship team cannot hear themselves on stage","Feedback at the pulpit that nobody can permanently cure","The production room grew piece by piece, so streaming and presentation fail mid service","The system only works when one particular volunteer is on the desk"],avl:[["Audio","Line array and distributed speaker systems, wireless microphone systems, digital mixing consoles, in-ear monitor systems, feedback elimination through EQ and speaker placement, SMAART-verified system tuning"],["Video","PTZ cameras, multi-camera live switching, YouTube/Facebook streaming, OBS and encoder configuration, LED video walls, projection and screen systems, lyric and presentation software integration"],["Lighting","Stage and platform lighting, DMX programming, architectural and altar lighting, LED fixture installation, haze and effects for contemporary worship"],["Acoustics","RT60 measurement and reverberation control, acoustic panel design and installation, bass management, STI speech intelligibility verification"],["Control","Dante/AES67 audio networking, scheduled automation, single-operator simplified control interfaces"]]},{id:"auditoriums",label:"Auditoriums",Icon:Ju,img:"photos/auditoriums-hall.webp",imgAlt:"A modern auditorium with stage, seating, and integrated line array system",line:"One hall, many uses: speech, music and visiting productions.",pains:["Speech wants a dry room, music wants a live one. Tuned by instinct, it serves neither.","Visiting productions arrive with a technical rider the house system cannot meet","Balconies and side blocks covered by hope rather than by design","No documented house specification to put in front of a hirer"],avl:[["Audio","Main hang and delay fill systems, stage monitoring, digital FOH consoles, 360-degree and in-the-round system design, broadcast mix feed, hearing assistance, delay calibration, feedback elimination"],["Video","FOH and stage confidence displays, mu _u,img:"photos/method-phase1-assessment.webp",imgAlt:"Engineer reviewing measurement software on a laptop beside a mixing console",body:"We visit the space in use and again when it is empty, and listen from where your audience actually sits. Reverberation, speech clarity, background noise and the existing system's response are measured with calibrated equipment, so the cause is identified rather than guessed at.",deliverable:"A written site survey report with annotated measurement graphs, prioritised recommendations and indicative budget ranges, yours to keep whether or not you continue."},{n:"02",title:"Acoustic simulation",Icon:Hl,img:"photos/method-phase2-simulation.webp",imgAlt:"EASE Focus 3 acoustic coverage prediction showing SPL heatmap across seating plan",body:"Treatment and loudspeaker layout are modelled in EASE Focus 3 against your actual seating plan. We know what every seat will receive before a single box is ordered.",deliverable:"Coverage prediction across the seating plan, targeting a 3 dB spread from the front row to the back, with the acoustic treatment schedule that makes it achievable."},{n:"03",title:"System design",Icon:Fl,img:"photos/method-phase3-design.webp",imgAlt:"Yamaha DSR115 speaker system design showing placement layout and frequency response analysis",body:"The design is written down: loudspeaker selection and positions, signal chain, network topology, control layout, and the predicted performance figures we intend to hit.",deliverable:"A full system design, itemised budget, signal flow drawing and a scope of work with predicted performance written into it."},{n:"04",title:"Physical integration",Icon:ql,body:"Rigging, cabling, networking and installation, scheduled around your calendar. All overhead rigging is installed to load-rated standards with written load calculations. Existing equipment is reused wherever it is genuinely fit for purpose.",deliverable:"As-built cable schedule, rack elevations, rigging documentation and signal flow drawing matching what is actually in the building."},{n:"05",title:"Tuning and verification",Icon:Hl,img:"photos/method-phase5-smaart.webp",imgAlt:"Smaart v9 transfer function measurement showing magnitude and phase response",body:"Time alignment, equalisation and gain structure set by measurement in Smaart v9, then verified at the seats. The room is measured again and compared against the prediction from stage two.",deliverable:"A commissioning report with before and after transfer functions and intelligibility figures. If the result falls short of the prediction and the cause is within our scope, correcting it is on us."},{n:"06",title:"Documentation and training",Icon:Fl,body:"Your own staff or volunteers are trained on the system as installed, not on a generic manual. Procedures are written for the people who will actually operate it.",deliverable:"Operating manual, scene list, written procedures and a training session, so the system keeps working when the team changes."}],sx=[["Smaart v9 \u2014 System Alignment and Tuning","Rational Acoustics \xB7 certified","Verified before-and-after transfer functions on every project. The credential that turns opinion into evidence."],["Diploma in Audio Engineering and Music Production","AAT College, Chennai (formerly SAE)","Formal grounding in signal flow, acoustics and production: the foundation the rest is built on."],["Architectural Acoustics","SWAYAM / NPTEL \xB7 in progress, 2026","The absorption, geometry and reverberation recommendations behind every survey report."],["Certified Technology Specialist (CTS)","AVIXA \xB7 in progress, November 2026","The international benchmark credential for audiovisual systems integration."],["Networking and control platforms","Dante Level 2 (Audinate) \xB7 NETGEAR AV \xB7 Q-SYS Architect","Audio-over-IP across multiple switches, network configuration that keeps audio and video stable on one building network, and the control platform your staff will actually operate."]],rx=[["How do we start, and what does it cost?","Start with a free twenty minute call. We will work out whether the problem is the space, the system design, the installation or the way it is being operated, and tell you honestly if you do not need us. If you want to go deeper, a one hour discovery call is \u20B92,000 plus GST. A full site survey, on site with measurement equipment and followed by a written report, is normally \u20B98,000 plus GST, currently \u20B96,000 for the first ten clients. Travel and stay are extra where applicable, and the survey fee is adjusted in full against any project that follows."],["What will a full project cost?","It depends almost entirely on the space, which is why we measure and design before quoting. The survey report gives you a priority order, so you can spread the work across budget years instead of committing to all of it at once. We will give you honest budget ranges on the first call, before you have spent anything with us."],["We have a full band. Do you understand contemporary worship?","Yes. The founder has spent a decade mixing live bands, so the specific problems are familiar rather than theoretical. Low end from kick and bass covering the vocal, stage volume fighting the room, in-ear monitoring, tracks and click, and a livestream feed that has to work at the same time as the room."],["Do you handle video and lighting as well as sound?","Yes. Video and lighting are delivered with production partners we have worked alongside for years, specified and project managed to the same standard as the audio. You deal with one team and one scope of work."],["We already have a tech team. Are you replacing them?","No. Your team knows your services, your musicians and your building, and none of that transfers. Our job is to give them a system that behaves the same way every week and documentation that survives a handover, then train them on it."],["Where do you work?","Based in Chennai and Bengaluru, we work across Tamil Nadu, Kerala and Karna                     gap: clamp(1.75rem, 4vw, 2.75rem); align-items: center; }
        @media (min-width: 1000px) {
          .rev-hero { grid-template-columns: minmax(0,5fr) minmax(0,7fr); }
        }

        /* sector tabs: even grid instead of a ragged wrap on tablets */
        .rev-tabs { display: grid; gap: 0.5rem; margin-top: 2rem;
                    grid-template-columns: repeat(auto-fit, minmax(138px, 1fr)); }
        @media (max-width: 420px) { .rev-tabs { grid-template-columns: 1fr 1fr; } }

        /* sector panel: divider flips from bottom to right at the breakpoint */
        .rev-panel { display: grid; grid-template-columns: 1fr; margin-top: 2rem; }
        .rev-panel-l { padding: clamp(1.4rem, 2.6vw, 2rem);
                       border-bottom: 1px solid ${r.line}; }
        .rev-panel-r { padding: clamp(1.4rem, 2.6vw, 2rem); }
        @media (min-width: 840px) {
          .rev-panel { grid-template-columns: minmax(0,4.5fr) minmax(0,7.5fr); }
          .rev-panel-l { border-bottom: 0; border-right: 1px solid ${r.line}; }
        }

        /* credentials rows */
        .rev-cred { display: grid; grid-template-columns: 1fr; gap: 0.4rem;
                    padding: 18px 0; border-bottom: 1px solid ${r.line}; }
        @media (min-width: 760px) {
          .rev-cred { grid-template-columns: minmax(0,16rem) minmax(0,1fr); gap: 0.4rem 2.2rem; }
        }

        /* method body indent scales down on small screens */
        .rev-phase-body { padding-left: clamp(1.6rem, 5vw, 2.75rem);
                          padding-bottom: 1.5rem; max-width: 72ch; }

        /* booking + form */
        .rev-book { display: grid; grid-template-columns: 1fr;
                    gap: clamp(2.25rem, 4vw, 3rem); }
        @media (min-width: 960px) {
          .rev-book { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
        }
        .rev-care { display: grid; grid-template-columns: 1fr; gap: 1.1rem; }
        @media (min-width: 760px) { .rev-care { grid-template-columns: 1fr 1fr; } }
        .rev-form { display: grid; grid-template-columns: 1fr; gap: 0.9rem; margin-top: 1.75rem; }
        @media (min-width: 540px) { .rev-form { grid-template-columns: 1fr 1fr; } }
        .rev-form-full { grid-column: 1 / -1; }

        /* footer */
        .rev-avl { display: grid; grid-template-columns: 1fr 1fr; gap: 0;
                   border-top: 1px solid ${r.line}; border-bottom: 1px solid ${r.line}; }
        .rev-avl > div { padding: 1.15rem 1.4rem 1.15rem 0;
                         border-right: 1px solid ${r.line};
                         border-bottom: 1px solid ${r.line}; }
        .rev-avl > div:nth-child(2n) { border-right: 0; }
        .rev-avl > div:nth-child(n+3) { border-bottom: 0; }
        @media (min-width: 900px) {
          .rev-avl { grid-template-columns: repeat(4, 1fr); }
          .rev-avl > div { border-bottom: 0; border-right: 1px solid ${r.line}; }
          .rev-avl > div:last-child { border-right: 0; }
        }

        .rev-two { display: grid; grid-template-columns: 1fr; gap: 1px;
                   background: ${r.line}; border: 1px solid ${r.line}; }
        .rev-two > div { background: ${r.ground}; padding: clamp(1.2rem, 2.2vw, 1.6rem); }
        @media (min-width: 700px) { .rev-two { grid-template-columns: 1fr 1fr; } }

        .rev-foot { display: grid; gap: clamp(1.5rem, 3vw, 1.9rem);
                    grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); }

        /* chart controls never overflow */
        .rev-chart-head { display: flex; flex-wrap: wrap; align-items: center;
                          justify-content: space-between; gap: 0.5rem; margin-bottom: 0.75rem; }
        .rev-chart-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
