il, the more the previous word covers up the next one."})]})}var ux=[{title:"The speech intelligibility gap",body:"Sound builds up on tile, glass, concrete and plaster and arrives late, masking the consonants that carry meaning. Turning the system up feeds the same reflections. Clear at the front, unusable at the back \u2014 and no loudspeaker will fix it."},{title:"Over-specifying hardware to solve a room",body:"When margin comes from equipment, the diagnosis is always that there was not enough of it. Organisations replace their system two or three times before anyone measures the room, and each replacement inherits the same problem."},{title:"Nobody measured anything",body:"A proposal that names brands and quantities but cannot state the predicted clarity score at the back row is a shopping list, not a design. Ask any supplier for their coverage prediction before you sign."},{title:"Operator knowledge that walks out of the building",body:"An undocumented system lives in one person's head. When they travel or leave, the settings drift and the system degrades. Documentation is what makes a system survive a handover."}],qf=[{id:"churches",label:"Churches",Icon:Vu,line:"From full contemporary worship bands to cathedral organs and hymns, the words have to reach the back row.",pains:["The band is loud but the vocals get lost underneath it","Clear in the front rows, echo at the back, whatever the equipment cost","Stone walls and a high ceiling ring for seconds, which suits the organ and defeats the sermon","The worship team cannot hear themselves on stage","Feedback at the pulpit that nobody can permanently cure","The production room grew piece by piece, so streaming and presentation fail mid service","The system only works when one particular volunteer is on the desk"],avl:"Also delivered here: camera, switching and streaming video, presentation and lyric playback for the tech team, and stage lighting that suits a band set and a traditional service equally."},{id:"auditoriums",label:"Auditoriums",Icon:Yu,line:"One hall, many uses \u2014 speech, music and visiting productions.",pains:["Speech wants a dry room, music wants a live one \u2014 tuned by instinct, it serves neither","Visiting productions arrive with a technical rider the house system cannot meet","Balconies and side blocks covered by hope rather than by design","No documented house specification to put in front of a hirer"],avl:"Also delivered here: projection and LED wall, stage and house lighting, and the control system that ties them together."},{id:"education",label:"Education",Icon:Qu,line:"If the back row cannot follow the lecture, the room is the problem.",pains:["Ceiling fans and split ACs sitting a few decibels below the teacher's voice","Teachers pushing their voice all week and losing it by Wednesday","A single front loudspeaker adding volume without adding clarity","Recorded and hybrid lectures that sound like a tunnel"],avl:"Also delivered here: lecture capture and streaming video, displays, and lighting for halls and lecture theatres."},{id:"corporate",label:"Corporate",Icon:El,line:"Video calls where the far end hears every word the first time.",pains:["Glass-walled rooms with nothing in them to absorb a voice",'"Camera problems" and "network problems" that are room problems',"Town halls held in atriums and cafeterias never designed for speech","Rooms certified on paper but never verified in practice"],avl:"Also delivered here: conference cameras and displays, digital signage, and meeting room lighting control."},{id:"hospitality",label:"Hospitality",Icon:Lt,line:"Atmosphere without the shouting.",pains:["The shouting spiral \u2014 guests raise their voices, so everyone else does too","Polished concrete, brick, glass and steel: beautiful, acoustically hostile","One volume for a bar that wants energy and a dining room that wants conversation","Systems fitted during interior works by a contractor with no measurement kit"],avl:"Also delivered here: display and menu screens, and lighting scenes that change with the time of day."},{id:"studios",label:"Studios",Icon:Ku,line:"Studios, control rooms and church production rooms, where small spaces are hardest to get right.",pains:["In a small room the space colours everything you hear","The mix does not translate to a car, headphones or the auditorium","Production rooms assembled piece by piece, then failing mid service","Audio, video and control traffic all fighting over one unmanaged switch"],avl:"Also delivered here: camera, switching and streaming video, with key and background lighting designed for it."},{id:"residential",label:"Residential",Icon:Xu,line:"The performance you already paid for, out of the room you have.",pains:["Bass overwhelming in one seat and absent in the next","Dialogue you keep rewinding, because of reflections you cannot hear as reflections","Seating placed for the furniture, not for the sound","Cinema levels travelling through the rest of the house after nine at night"],avl:"Also delivered here: projection or LED display, picture calibration, and cinema lighting scenes."}],ox=[{n:"01",title:"Measured assessment",Icon:Ju,body:"We visit the space in use and again when it is empty, and listen from where your audience actually sits. Reverberation, speech clarity, background noise and the existing system's response are measured with calibrated equipment, so the cause is identified rather than guessed at.",deliverable:"A written site survey report with annotated measurement graphs, prioritised recommendations and indicative budget ranges \u2014 yours to keep whether or not you continue."},{n:"02",title:"Acoustic simulation",Icon:ql,body:"Treatment and loudspeaker layout are modelled in EASE Focus 3 against your actual seating plan. We know what every seat will receive before a single box is ordered.",deliverable:"Coverage prediction across the seating plan, targeting a 3 dB spread from the front row to the back, with the acoustic treatment schedule that makes it achievable."},{n:"03",title:"System design",Icon:Hl,body:"The design is written down: loudspeaker selection and positions, signal chain, network topology, control layout, and the predicted performance figures we intend to hit.",deliverable:"A full system design, itemised budget, signal flow drawing and a scope of work with predicted performance written into it."},{n:"04",title:"Physical integration",Icon:El,body:"Rigging, cabling, networking and installation, scheduled around your calendar. All overhead rigging is installed to load-rated standards with written load calculations. Existing equipment is reused wherever it is genuinely fit for purpose.",deliverable:"As-built cable schedule, rack elevations, rigging documentation and signal flow drawing matching what is actually in the building."},{n:"05",title:"Tuning and verification",Icon:ql,body:"Time alignment, equalisation and gain structure set by measurement in Smaart v9, then verified at the seats. The room is measured again and compared against the prediction from stage two.",deliverable:"A commissioning report with before and after transfer functions and intelligibility figures. If the result falls short of the prediction and the cause is within our scope, correcting it is on us."},{n:"06",title:"Documentation and training",Icon:Hl,body:"Your own staff or volunteers are trained on the system as installed, not on a generic manual. Procedures are written for the people who will actually operate it.",deliverable:"Operating manual, scene list, written procedures and a training session \u2014 so the system survives a change of operator."}],fx=[["Smaart v9 \u2014 System Alignment and Tuning","Rational Acoustics \xB7 certified","Verified before-and-after transfer functions on every project. The credential that turns opinion into evidence."],["Diploma in Audio Engineering and Music Production","AAT College, Chennai (formerly SAE)","Formal grounding in signal flow, acoustics and production \u2014 the foundation the rest is built on."],["Architectural Acoustics","SWAYAM / NPTEL \xB7 in progress, 2026","The absorption, geometry and reverberation recommendations behind every survey report."],["Certified Technology Specialist (CTS)","AVIXA \xB7 in progress, November 2026","The international benchmark credential for audiovisual systems integration."],["Networking and control platforms","Dante Level 2 (Audinate) \xB7 NETGEAR AV \xB7 Q-SYS Architect","Audio-over-IP across multiple switches, network configuration that keeps audio and video stable on one building network, and the control platform your staff will actually operate."]],dx=[["How do we start, and what does it cost?","Start with a free twenty minute call. We will work out whether the problem is the space, the system design, the installation or the way it is being operated, and tell you honestly if you do not need us. If you want to go deeper, a one hour discovery call is \u20B92,000 plus GST. A full site survey, on site with measurement equipment and followed by a written report, is normally \u20B98,000 plus GST, currently \u20B96,000 for the first ten clients. Travel and stay are extra where applicable, and the survey fee is adjusted in full against any project that follows."],["What will a full project cost?","It depends almost entirely on the space, which is why we measure and design before quoting. The survey report gives you a priority order, so you can spread the work across budget years instead of committing to all of it at once. We will give you honest budget ranges on the first call, before you have spent anything with us."],["We have a full band. Do you understand contemporary worship?","Yes. The founder has spent a decade mixing live bands, so the specific problems are familiar rather than theoretical. Low end from kick and bass covering the vocal, stage volume fighting the room, in-ear monitoring, tracks and click, and a livestream feed that has to work at the same time as the room."],["Do you handle video and lighting as well as sound?","Yes. Video and lighting are delivered with production partners we have worked alongside for years, specified and project managed to the same standard as the audio. You deal with one team and one scope of work."],["We already have a tech team. Are you replacing them?","No. Your team knows your services, your musicians and your building, and none of that transfers. Our job is to give them a system that behaves the same way every week and documentation that survives a handover, then train them on it."],["Where do you work?","Based in Chennai and Bengaluru, we work across Tamil Nadu, Kerala and Karnataka, from the capital cities down through Coimbatore, Trichy, Madurai and the Nagercoil and Kanniyakumari belt, and across Kochi, Thiruvananthapuram and the wider Kerala coast. Andhra Pradesh, Telangana and Hyderabad are covered from Bengaluru. Projects elsewhere in India are taken on merit, as are Gulf projects. Travel and stay are quoted separately and openly."]];function Ti(){let[e,a]=(0,Ie.useState)("churches"),[t,l]=(0,Ie.useState)(0),[u,o]=(0,Ie.useState)(0),[f,d]=(0,Ie.useState)({name:"",org:"",space:"Church or house of worship",phone:"",email:"",message:""}),[s,c]=(0,Ie.useState)("+91"),[g,x]=(0,Ie.useState)(!1),[p,L]=(0,Ie.useState)(!1),[C,A]=(0,Ie.useState)(!1),[O,r]=(0,Ie.useState)(!1),[n,m]=(0,Ie.useState)(!1),[S,b]=(0,Ie.useState)(""),[U,I]=(0,Ie.useState)(!1),T=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()),D={name:f.name.trim()?"":"Please tell us your name.",phone:f.phone.trim()?/^[0-9][0-9\s-]{5,14}$/.test(f.phone.trim())?"":"Enter the number without the country code.":"We need a number to reach you on.",email:f.email.trim()?T(f.email)?"":"That email address does not look right.":"Please add an email address."},R=!!(D.name||D.phone||D.email),P=S.trim()?T(S)?"":"That email address does not look right.":"Please add an email address.",Ze=async v=>{let ve=await(await fetch("https://api.web3forms.com/submit",{method:"POST",hea         @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
        * { box-sizing: border-box; }
        input:focus, textarea:focus, select:focus { border-color: ${h.gold} !important; }
        .rev-nav a:hover { color: ${h.goldText} !important; }
        .rev-social:hover { border-color: ${h.gold} !important; color: ${h.goldLight} !important; }

        /* fluid container: padding and width scale with the viewport */
        .rev-wrap { max-width: 1180px; margin-inline: auto;
                    padding-inline: clamp(1.1rem, 4vw, 3rem); }
        .rev-band { padding-block: clamp(2.75rem, 6vw, 5rem); }
        .rev-head { padding-block: 0.6rem; }
        .rev-foot-pad { padding-block: clamp(2.5rem, 5vw, 3.25rem); }

        /* hero: single column until there is genuinely room for two */
        .rev-hero { display: grid; grid-template-columns: 1fr;
                    gap: clamp(1.75rem, 4vw, 2.75rem); align-items: center; }
        @media (min-width: 1000px) {
          .rev-hero { grid-template-columns: minmax(0,5fr) minmax(0,7fr); }
        }

        /* sector tabs: even grid instead of a ragged wrap on tablets */
        .rev-tabs { display: grid; gap: 0.5rem; margin-top: 2rem;
                    grid-template-columns: repeat(auto-fit, minmax(138px, 1fr)); }
        @media (max-width: 420px) { .rev-tabs { grid-template-columns: 1fr 1fr; } }

        /* sector panel: divider flips from bottom to right at the breakpoint */
        .rev-panel { display: grid; grid-template-columns: 1fr; margin-top: 2rem; }
        .rev-panel-l { padding: clamp(1.4rem, 2.6vw, 2rem);
                       border-bottom: 1px solid ${h.line}; }
        .rev-panel-r { padding: clamp(1.4rem, 2.6vw, 2rem); }
        @media (min-width: 840px) {
          .rev-panel { grid-template-columns: minmax(0,4.5fr) minmax(0,7.5fr); }
          .rev-panel-l { border-bottom: 0; border-right: 1px solid ${h.line}; }
        }

        /* credentials rows */
        .rev-cred { display: grid; grid-template-columns: 1fr; gap: 0.4rem;
                    padding: 18px 0; border-bottom: 1px solid ${h.line}; }
        @media (min-width: 760px) {
          .rev-cred { grid-template-columns: minmax(0,16rem) minmax(0,1fr); gap: 0.4rem 2.2rem; }
        }

        /* method body indent scales down on small screens */
        .rev-phase-body { padding-left: clamp(1.6rem, 5vw, 2.75rem);
                          padding-bottom: 1.5rem; max-width: 72ch; }

        /* booking + form */
        .rev-book { display: grid; grid-template-columns: 1fr;
                    gap: clamp(2.25rem, 4vw, 3rem); }
        @media (min-width: 960px) {
          .rev-book { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
        }
        .rev-care { display: grid; grid-template-columns: 1fr; gap: 1.1rem; }
        @media (min-width: 760px) { .rev-care { grid-template-columns: 1fr 1fr; } }
        .rev-form { display: grid; grid-template-columns: 1fr; gap: 0.9rem; margin-top: 1.75rem; }
        @media (min-width: 540px) { .rev-form { grid-template-columns: 1fr 1fr; } }
        .rev-form-full { grid-column: 1 / -1; }

        /* footer */
        .rev-avl { display: grid; grid-template-columns: 1fr 1fr; gap: 0;
                   border-top: 1px solid ${h.line}; border-bottom: 1px solid ${h.line}; }
        .rev-avl > div { padding: 1.15rem 1.4rem 1.15rem 0;
                         border-right: 1px solid ${h.line};
                         border-bottom: 1px solid ${h.line}; }
        .rev-avl > div:nth-child(2n) { border-right: 0; }
        .rev-avl > div:nth-child(n+3) { border-bottom: 0; }
        @media (min-width: 900px) {
          .rev-avl { grid-template-columns: repeat(4, 1fr); }
          .rev-avl > div { border-bottom: 0; border-right: 1px solid ${h.line}; }
          .rev-avl > div:last-child { border-right: 0; }
        }

        .rev-two { display: grid; grid-template-columns: 1fr; gap: 1px;
                   background: ${h.line}; border: 1px solid ${h.line}; }
        .rev-two > div { background: ${h.ground}; padding: clamp(1.2rem, 2.2vw, 1.6rem); }
        @media (min-width: 700px) { .rev-two { grid-template-columns: 1fr 1fr; } }

        .rev-foot { display: grid; gap: clamp(1.5rem, 3vw, 1.9rem);
                    grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); }

        /* chart controls never overflow */
        .rev-chart-head { display: flex; flex-wrap: wrap; align-items: center;
