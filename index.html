here people actually sit."},{title:"Over-specifying hardware to solve a room",body:"When margin comes from equipment rather than measurement, the diagnosis is always that there was not enough of it \u2014 and each replacement inherits the same unmeasured room. We prevent it by designing to the room's measured behaviour first, so hardware is specified to solve the actual problem rather than to compensate for it."},{title:"Nobody measured anything",body:"A proposal that names brands and quantities but cannot state the predicted clarity score at the back row is a shopping list, not a design, so the client only finds out whether it works after paying for it and living with it. We prevent it by giving a coverage prediction before you sign, and a measured commissioning report before we hand over."},{title:"Operator knowledge that walks out of the building",body:"An undocumented system lives in one person's head, so when they travel or leave, the settings drift and the system quietly degrades until someone notices mid-service. We prevent it with written procedures, a training session on the system as installed, and documentation built to survive a change of operator."}],Fd=[{id:"churches",label:"Churches",Icon:Zu,img:"photos/churches-advent-hero.webp",imgAlt:"Digital mixing console in operation during a live church service",line:"From full contemporary worship bands to cathedral organs and hymns, the words have to reach the back row.",pains:["The band is loud but the vocals get lost underneath it","Clear in the front rows, echo at the back, whatever the equipment cost","Stone walls and a high ceiling ring for seconds, which suits the organ and defeats the sermon","The worship team cannot hear themselves on stage","Feedback at the pulpit that nobody can permanently cure","The production room grew piece by piece, so streaming and presentation fail mid service","The system only works when one particular volunteer is on the desk"],avl:[["Audio","Line array and distributed spea dentified rather than guessed at.",deliverable:"A written site survey report with annotated measurement graphs, prioritised recommendations and indicative budget ranges, yours to keep whether or not you continue."},{n:"02",title:"Acoustic simulation",Icon:ql,img:"photos/method-phase2-simulation.webp",imgAlt:"EASE Focus 3 acoustic coverage prediction showing SPL heatmap across seating plan",body:"Treatment and loudspeaker layout are modelled in EASE Focus 3 against your actual seating plan. We know what every seat will receive before a single box is ordered.",deliverable:"Coverage prediction across the seating plan, targeting a 3 dB spread from the front row to the back, with the acoustic treatment schedule that makes it achievable."},{n:"03",title:"System design",Icon:Fl,img:"photos/method-phase3-design.webp",imgAlt:"Yamaha DSR115 speaker system design showing placement layout and frequency response analysis",body:"The design is written down: loudspeaker selection and positions, signal chain, network topology, control layout, and the predicted performance figures we intend to hit.",deliverable:"A full system design, itemised budget, signal flow drawing and a scope of work with predicted performance written into it."},{n:"04",title:"Physical integration",Icon:Hl,body:"Rigging, cabling, networking and installation, scheduled around your calendar. All overhead rigging is installed to load-rated standards with written load calculations. Existing equipment is reused wherever it is genuinely fit for purpose.",deliverable:"As-built cable schedule, rack elevations, rigging documentation and signal flow drawing matching what is actually in the building."},{n:"05",title:"Tuning and verification",Icon:ql,img:"photos/method-phase5-smaart.webp",imgAlt:"Smaart v9 transfer function measurement showing magnitude and phase response",body:"Time alignment, equalisation and gain structure set by measurement in Smaart v9, then verified at the seats. The room is measured again and compared against the prediction from stage two.",deliverable:"A commissioning report with before and after transfer functions and intelligibility figures. If the result falls short of the prediction and the cause is within our scope, correcting it is on us."},{n:"06",title:"Documentation and training",Icon:Fl,body:"Your own staff or volunteers are trained on the system as installed, not on a generic manual. Procedures are written for the people who will actually operate it.",deliverable:"Operating manual, scene list, written procedures and a training session, so the system keeps working when the team changes."}],nx=[["Smaart v9 \u2014 System Alignment and Tuning","Rational Acoustics \xB7 certified","Verified before-and-after transfer functions on every project. The credential that turns opinion into evidence."],["Diploma in Audio Engineering and Music Production","AAT College, Chennai (formerly SAE)","Formal grounding in signal flow, acoustics and production: the foundation the rest is built on."],["Architectural Acoustics","SWAYAM / NPTEL \xB7 in progress, 2026","The absorption, geometry and reverberation recommendations behind every survey report."],["Certified Technology Specialist (CTS)","AVIXA \xB7 in progress, November 2026","The international benchmark credential for audiovisual systems integration."],["Networking and control platforms","Dante Level 2 (Audinate) \xB7 NETGEAR AV \xB7 Q-SYS Architect","Audio-over-IP across multiple switches, network configuration that keeps audio and video stable on one building network, and the control platform your staff will actually operate."]],cx=[["How do we start, and what does it cost?","Start with a free twenty minute call. We will work out whether the problem is the space, the system design, the installation or the way it is being operated, and tell you honestly if you do not need us. If you want to go deeper, a one hour discovery call is \u20B92,000 plus GST. A full site survey, on site with measurement equipment and followed by a written report, is normally \u20B98,000 plus GST, currently \u20B96,000 for the first ten clients. Travel and stay are extra where applicable, and the survey fee is adjusted in full against any project that follows."],["What will a full project cost?","It depends almost entirely on the space, which is why we measure and design before quoting. The survey report gives you a priority order, so you can spread the work across budget years instead of committing to all of it at once. We will give you honest budget ranges on the first call, before you have spent anything with us."],["We have a full band. Do you understand contemporary worship?","Yes. The founder has spent a decade mixing live bands, so the specific problems are familiar rather than theoretical. Low end from kick and bass covering the vocal, stage volume fighting the room, in-ear monitoring, tracks and click, and a livestream feed that has to work at the same time as the room."],["Do you handle video and lighting as well as sound?","Yes. Video and lighting are delivered with production partners we have worked alongside for years, specified and project managed to the same standard as the audio. You deal with one team and one scope of work."],["We already have a tech team. Are you replacing them?","No. Your team knows your services, your musicians and your building, and none of that transfers. Our job is to give them a system that behaves the same way every week and documentation that survives a handover, then train them on it."],["Where do you work?","Based in Chennai and Bengaluru, we work across Tamil Nadu, Kerala and Karnataka, from the capital cities down through Coimbatore, Trichy, Madurai and the Nagercoil and Kanniyakumari belt, and across Kochi, Thiruvananthapuram and the wider Kerala coast. Andhra Pradesh, Telangana and Hyderabad are covered from Bengaluru. Projects elsewhere in India are taken on merit, as are Gulf projects. Travel and stay are quoted separately and openly."],["What if some
